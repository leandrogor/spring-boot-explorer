# Perfil JPA — se activaría con: spring.profiles.active=jpa
# Este archivo es de REFERENCIA. No se usa sin agregar spring-boot-starter-data-jpa al pom.xml.

spring:
  datasource:
    url: jdbc:h2:mem:explorerdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
